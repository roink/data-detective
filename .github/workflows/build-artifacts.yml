name: Build artifacts

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-artifacts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate H5P packages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Build and validate artifacts
        run: npm run check

      - name: Create checksums
        working-directory: dist
        run: sha256sum *.h5p > SHA256SUMS.txt

      - name: Upload H5P packages
        uses: actions/upload-artifact@v7
        with:
          name: hescor-h5p-packages
          path: |
            dist/*.h5p
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish latest H5P downloads
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download validated packages
        uses: actions/download-artifact@v8
        with:
          name: hescor-h5p-packages
          path: dist

      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_notes="Automatically generated from the latest master commit: https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          if gh release view h5p-latest --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/h5p-latest" -f sha="${GITHUB_SHA}" -F force=true
            gh release upload h5p-latest dist/*.h5p dist/SHA256SUMS.txt --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit h5p-latest --title "Latest H5P packages" --notes "${release_notes}" --latest --repo "${GITHUB_REPOSITORY}"
          else
            gh release create h5p-latest dist/*.h5p dist/SHA256SUMS.txt --target "${GITHUB_SHA}" --title "Latest H5P packages" --notes "${release_notes}" --latest --repo "${GITHUB_REPOSITORY}"
          fi
