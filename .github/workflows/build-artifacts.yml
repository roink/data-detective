name: Build artifacts

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-artifacts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate H5P packages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Build and validate artifacts
        run: npm run check

      - name: Create checksums
        run: sha256sum dist/*.h5p > dist/SHA256SUMS.txt

      - name: Upload H5P packages
        uses: actions/upload-artifact@v7
        with:
          name: hescor-h5p-packages
          path: |
            dist/*.h5p
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
